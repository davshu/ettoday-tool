<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ETtoday 圖卡神器 V15</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; background-color: #222; padding: 20px; color: #ddd; margin: 0; }
        
        .container { display: flex; gap: 30px; max-width: 1600px; margin: 0 auto; height: 95vh; }
        .editor { flex: 0 0 450px; background: #333; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); overflow-y: auto; display: flex; flex-direction: column; }
        .preview { flex: 1; background: #111; border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 20px; border: 1px solid #444; overflow: hidden; position: relative; box-sizing: border-box; }
        
        @media (max-width: 900px) {
            body { padding: 10px; }
            .container { flex-direction: column; height: auto; gap: 15px; }
            .editor { flex: none; width: 100%; box-sizing: border-box; padding: 15px; order: 2; }
            .preview { flex: none; width: 100%; height: auto; min-height: 300px; padding: 10px; order: 1; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.8); }
            canvas { max-height: 50vh; }
            h2 { font-size: 18px; }
            button { padding: 15px; font-size: 16px; }
        }

        h2 { color: #F58220; margin-top: 0; border-bottom: 3px solid #F58220; padding-bottom: 12px; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        
        label { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; font-weight: bold; font-size: 14px; color: #bbb; margin-bottom: 5px; }
        .val-display { color: #F58220; font-family: monospace; font-size: 12px; }

        input, textarea, select { width: 100%; box-sizing: border-box; padding: 12px; background: #444; border: 1px solid #555; color: white; border-radius: 6px; font-size: 15px; margin-top: 2px; font-family: "Noto Sans TC", inherit; transition: 0.2s; }
        input:focus, textarea:focus { border-color: #F58220; outline: none; background: #505050; }
        textarea { height: 70px; resize: vertical; }
        
        .slider-group { display: flex; align-items: center; gap: 10px; background: #2a2a2a; padding: 8px; border-radius: 6px; margin-top: 5px; }
        .slider-icon { font-size: 14px; width: 30px; text-align: center; color: #888; }
        input[type="range"] { flex: 1; cursor: pointer; margin: 0; padding: 0; height: 6px; width: 100%; }

        .file-upload { border: 2px dashed #666; padding: 20px; text-align: center; border-radius: 8px; margin-top: 10px; cursor: pointer; color: #888; transition: 0.2s; background: #2a2a2a; display: block; }
        .file-upload:hover { border-color: #F58220; color: #F58220; background: #333; }
        input[type="file"] { display: none; }

        /* URL 輸入區樣式 */
        .url-group { display: flex; gap: 5px; margin-top: 10px; }
        .url-input { flex: 1; padding: 10px; font-size: 13px; }
        .url-btn { width: 80px; background: #555; border: 1px solid #666; color: white; cursor: pointer; border-radius: 6px; }
        .url-btn:hover { background: #666; }
        .url-btn:disabled { background: #333; color: #888; cursor: not-allowed; }

        .action-row { display: flex; gap: 10px; margin-top: 30px; }
        .btn-main { flex: 2; background: linear-gradient(135deg, #F58220, #d96a0b); color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 15px rgba(245, 130, 32, 0.3); transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-main:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-main:disabled, .btn-copy:disabled { transform: none; box-shadow: none; opacity: 0.45; cursor: not-allowed; }
        .btn-copy { flex: 1; background: #00AA55; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 170, 85, 0.3); transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-copy:hover { transform: translateY(-2px); background: #00bb5d; }
        .action-btn { background: #444; border: 1px solid #666; font-size: 14px; padding: 10px; margin-top: 10px; width: 100%; cursor: pointer; color: #ddd; border-radius: 6px; }
        .action-btn:hover { background: #555; }

        canvas { box-shadow: 0 20px 50px rgba(0,0,0,0.5); max-height: 90vh; max-width: 100%; width: auto; height: auto; object-fit: contain; background: #000; }

        .input-group { display: none; border-top: 1px dashed #555; padding-top: 15px; margin-top: 15px; }
        .input-group.active { display: block; animation: fadeIn 0.3s; }
        .btn-group { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .small-btn { flex: 1; padding: 8px; font-size: 13px; border-radius: 4px; cursor: pointer; border: 1px solid #666; background: #444; color: white; transition: 0.2s; min-width: 60px; text-align: center; }
        .small-btn:hover { background: #555; border-color: #888; }
        
        .color-label { display: flex; align-items: center; gap: 10px; margin-top: 5px; cursor: pointer; }
        .color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #555; transition: transform 0.2s; }
        .color-label:hover .color-btn { transform: scale(1.1); border-color: white; }
        .text-color-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; min-height: 38px; margin: 8px 0 14px; }
        .text-color-swatch { flex: 0 0 34px; width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 2px solid #777; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2); }
        .text-color-swatch:hover, .text-color-swatch:focus-visible { transform: scale(1.08); border-color: white; outline: none; }
        .text-color-clear { flex: 0 0 38px; width: 38px; height: 34px; padding: 0; border: 1px solid #777; border-radius: 6px; background: #444; color: white; font-size: 19px; cursor: pointer; }
        .text-color-clear:hover, .text-color-clear:focus-visible { background: #555; border-color: white; outline: none; }
        .section-header { color: #F58220; font-size: 14px; margin-top: 20px; margin-bottom: 5px; border-left: 3px solid #F58220; padding-left: 8px; font-weight: bold; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: normal; margin-top: 10px; justify-content: flex-start; }
        input[type="checkbox"] { width: 20px; height: 20px; accent-color: #F58220; margin: 0; }
        .segmented-control { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
        .segmented-control.two { grid-template-columns: repeat(2, 1fr); }
        .segment-btn { padding: 10px 6px; border: 1px solid #666; background: #444; color: #eee; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .segment-btn.active { border-color: #F58220; background: #F58220; color: #1f1f1f; }
        .v15-points-editor { display: grid; gap: 8px; margin-top: 10px; }
        .v15-point-row { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 38px); gap: 6px; align-items: center; }
        .v15-point-row input { min-width: 0; margin: 0; }
        .icon-btn { width: 38px; height: 38px; padding: 0; border: 1px solid #666; border-radius: 6px; background: #444; color: #eee; cursor: pointer; }
        .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .v15-validation { margin: 10px 0 0; padding: 10px; border-left: 3px solid #00AA55; background: #292929; color: #bde8cd; font-size: 13px; }
        .v15-validation.invalid { border-color: #E72D48; color: #ffb6c2; }
        .v15-color-hint { margin: 6px 0 0; color: #888; font-size: 12px; }

        @media (max-width: 500px) {
            .v15-point-row { grid-template-columns: minmax(0, 1fr) repeat(3, 42px); }
            .segment-btn { min-height: 44px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="editor">
            <h2>📱 ETtoday 神器 V15</h2>
            <div style="font-size:12px; color:#888; margin-bottom:10px;">
                ✨ 自動權限解鎖：已升級多重代理通道 <br>
            </div>
            
            <label>1. 選擇版型 (1080x1350)</label>
            <select id="layoutSelector" onchange="switchLayout()">
                <option value="magazine">版型 1：雜誌封面風</option>
                <option value="glass">版型 2：懸浮玻璃卡片</option>
                <option value="news-points">版型 3：新聞三點整理</option>
            </select>

            <div class="section-header">背景處理</div>
            <label class="file-upload" id="dropZone">
                📸 上傳背景大圖 (或拖曳)
                <input type="file" id="bgUpload" accept="image/*" onchange="handleBg(this)">
            </label>
            
            <div class="url-group">
                <input type="text" id="imgUrl" class="url-input" placeholder="貼上連結 (例: https://cdn2.ettoday...)">
                <button class="url-btn" onclick="loadImgFromUrl()">🚀 載入</button>
            </div>
            <div style="font-size:11px; color:#666; margin-top:4px;">* 程式將自動切換 3 組代理伺服器來嘗試下載</div>

            <label>圖片濾鏡</label>
            <select id="bgFilter" onchange="handleImageControlChange('filter')">
                <option value="none">無濾鏡 (原圖)</option>
                <option value="grayscale">黑白 (質感)</option>
                <option value="brightness">增亮 20% (暗圖專用)</option>
                <option value="darken">壓暗 30% (凸顯文字)</option>
                <option value="contrast">高對比 (戲劇化)</option>
            </select>

            <label>縮放 <span id="v_bgZoom" class="val-display">100</span></label>
            <div class="slider-group">
                <span class="slider-icon">🔍</span>
                <input type="range" id="bgZoom" min="100" max="300" step="5" value="100" oninput="handleImageControlChange('zoom')">
            </div>
            
            <label>移動 (X, Y) <span class="val-display" id="v_pan">50, 50</span></label>
            <div class="slider-group">
                <span class="slider-icon">↔</span>
                <input type="range" id="bgPanX" min="0" max="100" step="2" value="50" oninput="handleImageControlChange('pan')">
                <span class="slider-icon">↕</span>
                <input type="range" id="bgPanY" min="0" max="100" step="2" value="50" oninput="handleImageControlChange('pan')">
            </div>
            
            <div class="section-header">主標題 (強制粗體)</div>
            <input type="text" id="mainTitle" value="北市房價再創新高！" oninput="draw()">
            <label>字體大小 <span id="v_titleSize" class="val-display">90</span></label>
            <div class="slider-group">
                <span class="slider-icon">A-</span>
                <input type="range" id="titleSize" min="40" max="140" step="2" value="90" oninput="updateVal('titleSize'); draw()">
                <span class="slider-icon">A+</span>
            </div>

            <div class="section-header">標籤 (Tag)</div>
            <div class="btn-group">
                <button class="small-btn" onclick="setTagText('快訊')">快訊</button>
                <button class="small-btn" onclick="setTagText('房產')">房產</button>
                <button class="small-btn" onclick="setTagText('財經')">財經</button>
                <button class="small-btn" onclick="setTagText('國際')">國際</button>
                <button class="small-btn" onclick="setTagText('政治')">政治</button>
            </div>
            <input type="text" id="tagText" value="房產" oninput="draw()">
            
            <label class="checkbox-label">
                <input type="checkbox" id="showDate" checked onchange="draw()">
                顯示今日日期 (右下角)
            </label>

            <label style="margin-top:10px">標籤底色</label>
            <div class="btn-group" style="align-items: center; gap: 12px; flex-wrap: wrap;">
                <div class="color-label" onclick="setTagColor('#F58220')"><div class="color-btn" style="background: #F58220;"></div><span class="color-name">官方</span></div>
                <div class="color-label" onclick="setTagColor('#0077CC')"><div class="color-btn" style="background: #0077CC;"></div><span class="color-name">台北</span></div>
                <div class="color-label" onclick="setTagColor('#00AA55')"><div class="color-btn" style="background: #00AA55;"></div><span class="color-name">台中</span></div>
                <div class="color-label" onclick="setTagColor('#E60012')"><div class="color-btn" style="background: #E60012;"></div><span class="color-name">高雄</span></div>
                <div class="color-label" onclick="setTagColor('#8E44AD')"><div class="color-btn" style="background: #8E44AD;"></div><span class="color-name">國際</span></div>
                <div class="color-label" onclick="setTagColor('#E84393')"><div class="color-btn" style="background: #E84393;"></div><span class="color-name">娛樂</span></div>
                <div class="color-label" onclick="setTagColor('#16A085')"><div class="color-btn" style="background: #16A085;"></div><span class="color-name">政治</span></div>
                <div class="color-label" onclick="setTagColor('#D4AC0D')"><div class="color-btn" style="background: #D4AC0D;"></div><span class="color-name">體育</span></div>
                <div class="color-label" onclick="setTagColor('#34495E')"><div class="color-btn" style="background: #34495E;"></div><span class="color-name">社會</span></div>
                <div class="color-label" onclick="setTagColor('#7F8C8D')"><div class="color-btn" style="background: #7F8C8D;"></div><span class="color-name">生活</span></div>
                <div class="color-label" onclick="setTagColor('#000000')"><div class="color-btn" style="background: #000000;"></div><span class="color-name">純黑</span></div>
                <div class="color-label" onclick="setTagColor('#273C75')"><div class="color-btn" style="background: #273C75;"></div><span class="color-name">財經</span></div>
            </div>

            <div id="group-magazine" class="input-group active">
                <div class="section-header">內容與引言</div>
                <textarea id="m_Sub" oninput="draw()">信義區單坪破300萬，專家分析：這波漲勢恐延續至年底。</textarea>

                <label>局部文字顏色</label>
                <div class="text-color-tools" aria-label="局部文字顏色">
                    <button type="button" class="text-color-swatch" style="background:#FC8416" aria-label="ET 橘" title="ET 橘" onmousedown="event.preventDefault()" onclick="applySelectedTextColor('#FC8416')"></button>
                    <button type="button" class="text-color-swatch" style="background:#E72D48" aria-label="快訊紅" title="快訊紅" onmousedown="event.preventDefault()" onclick="applySelectedTextColor('#E72D48')"></button>
                    <button type="button" class="text-color-swatch" style="background:#FAC03D" aria-label="重點黃" title="重點黃" onmousedown="event.preventDefault()" onclick="applySelectedTextColor('#FAC03D')"></button>
                    <button type="button" class="text-color-swatch" style="background:#91CFD5" aria-label="資訊藍" title="資訊藍" onmousedown="event.preventDefault()" onclick="applySelectedTextColor('#91CFD5')"></button>
                    <button type="button" class="text-color-swatch" style="background:#66D3C0" aria-label="生活青" title="生活青" onmousedown="event.preventDefault()" onclick="applySelectedTextColor('#66D3C0')"></button>
                    <button type="button" class="text-color-swatch" style="background:#91C53A" aria-label="健康綠" title="健康綠" onmousedown="event.preventDefault()" onclick="applySelectedTextColor('#91C53A')"></button>
                    <button type="button" class="text-color-swatch" style="background:#E6397C" aria-label="娛樂粉" title="娛樂粉" onmousedown="event.preventDefault()" onclick="applySelectedTextColor('#E6397C')"></button>
                    <button type="button" class="text-color-swatch" style="background:#B56CFF" aria-label="焦點紫" title="焦點紫" onmousedown="event.preventDefault()" onclick="applySelectedTextColor('#B56CFF')"></button>
                    <button type="button" class="text-color-clear" aria-label="清除顏色" title="恢復選取文字的預設顏色" onmousedown="event.preventDefault()" onclick="applySelectedTextColor(null)">×</button>
                </div>

                <label>內文字體大小 <span id="v_m_SubSize" class="val-display">46</span></label>
                <div class="slider-group">
                    <span class="slider-icon">A-</span>
                    <input type="range" id="m_SubSize" min="24" max="80" step="2" value="46" oninput="updateVal('m_SubSize'); draw()">
                    <span class="slider-icon">A+</span>
                </div>

                <label style="margin-top:10px">遮罩強度 <span id="v_m_Overlay" class="val-display">0.8</span></label>
                <div class="slider-group">
                    <span class="slider-icon">☀︎</span>
                    <input type="range" id="m_Overlay" min="0" max="1" step="0.1" value="0.8" oninput="updateVal('m_Overlay'); draw()">
                    <span class="slider-icon">☾</span>
                </div>
            </div>

            <div id="group-glass" class="input-group">
                <div class="section-header">內容設定</div>
                <label>卡片標題</label>
                <input type="text" id="g_Title" value="購屋族該如何應對？" oninput="draw()">
                
                <label>重點內容 (強制粗體)</label>
                <textarea id="g_Desc" style="height:120px;" oninput="draw()">1. 鎖定蛋白區潛力股2. 善用新青安貸款優惠3. 避免過度追高</textarea>
                
                <label>內文字體大小 <span id="v_g_SubSize" class="val-display">40</span></label>
                <div class="slider-group">
                    <span class="slider-icon">A-</span>
                    <input type="range" id="g_SubSize" min="24" max="60" step="2" value="40" oninput="updateVal('g_SubSize'); draw()">
                    <span class="slider-icon">A+</span>
                </div>
            </div>

            <div id="group-news-points" class="input-group">
                <div class="section-header">新版型比例</div>
                <div id="v15Ratio" class="segmented-control" role="group" aria-label="照片與文字比例">
                    <button type="button" class="segment-btn" data-ratio="55" onclick="setV15Ratio(55)">照片多<br>55 / 45</button>
                    <button type="button" class="segment-btn active" data-ratio="45" onclick="setV15Ratio(45)">平衡<br>45 / 55</button>
                    <button type="button" class="segment-btn" data-ratio="35" onclick="setV15Ratio(35)">文字多<br>35 / 65</button>
                </div>

                <label>文字區底色</label>
                <div id="v15Theme" class="segmented-control two" role="group" aria-label="文字區底色">
                    <button type="button" class="segment-btn active" data-theme="light" onclick="setV15Theme('light')">明亮</button>
                    <button type="button" class="segment-btn" data-theme="dark" onclick="setV15Theme('dark')">黑暗</button>
                </div>

                <label>重點字體大小 <span id="v_v15PointSize" class="val-display">40</span></label>
                <div class="slider-group">
                    <span class="slider-icon">A-</span>
                    <input type="range" id="v15PointSize" min="28" max="54" step="2" value="40" oninput="setV15PointSize(this.value)">
                    <span class="slider-icon">A+</span>
                </div>

                <div class="section-header">重點文字</div>
                <div id="v15PointsEditor" class="v15-points-editor"></div>
                <button type="button" id="v15AddPoint" class="action-btn" onclick="addV15Point()">＋ 新增重點</button>

                <label>局部文字顏色</label>
                <div class="text-color-tools" aria-label="新版型局部文字顏色">
                    <button type="button" class="text-color-swatch" style="background:#FC8416" aria-label="ET 橘" onmousedown="event.preventDefault()" onclick="applySelectedTextColor('#FC8416')"></button>
                    <button type="button" class="text-color-swatch" style="background:#E72D48" aria-label="快訊紅" onmousedown="event.preventDefault()" onclick="applySelectedTextColor('#E72D48')"></button>
                    <button type="button" class="text-color-swatch" style="background:#FAC03D" aria-label="重點黃" onmousedown="event.preventDefault()" onclick="applySelectedTextColor('#FAC03D')"></button>
                    <button type="button" class="text-color-swatch" style="background:#91CFD5" aria-label="資訊藍" onmousedown="event.preventDefault()" onclick="applySelectedTextColor('#91CFD5')"></button>
                    <button type="button" class="text-color-swatch" style="background:#66D3C0" aria-label="生活青" onmousedown="event.preventDefault()" onclick="applySelectedTextColor('#66D3C0')"></button>
                    <button type="button" class="text-color-swatch" style="background:#91C53A" aria-label="健康綠" onmousedown="event.preventDefault()" onclick="applySelectedTextColor('#91C53A')"></button>
                    <button type="button" class="text-color-swatch" style="background:#E6397C" aria-label="娛樂粉" onmousedown="event.preventDefault()" onclick="applySelectedTextColor('#E6397C')"></button>
                    <button type="button" class="text-color-swatch" style="background:#B56CFF" aria-label="焦點紫" onmousedown="event.preventDefault()" onclick="applySelectedTextColor('#B56CFF')"></button>
                    <button type="button" class="text-color-clear" aria-label="清除顏色" onmousedown="event.preventDefault()" onclick="applySelectedTextColor(null)">×</button>
                </div>
                <p class="v15-color-hint">反白選取主標題或任一重點文字後套用。</p>

                <button type="button" class="action-btn" onclick="resetV15PhotoPosition()">重設照片位置</button>
                <p id="v15Validation" class="v15-validation" aria-live="polite">請先載入照片。</p>
            </div>

            <div id="globalLogoControls" class="global-logo-controls">
                <div class="section-header">右上 Logo</div>
                <label class="checkbox-label">
                    <input type="checkbox" id="v15ShowLogo" checked onchange="setV15ShowLogo(this.checked)">
                    顯示右上 Logo（沿用 V14 尺寸）
                </label>
                <label>Logo 樣式</label>
                <div id="v15LogoMode" class="segmented-control two" role="group" aria-label="Logo 樣式">
                    <button type="button" class="segment-btn active" data-logo-mode="company" onclick="setV15LogoMode('company')">公司 Logo</button>
                    <button type="button" class="segment-btn" data-logo-mode="capsule" onclick="setV15LogoMode('capsule')">V14 文字膠囊</button>
                </div>
            </div>

            <div class="section-header">其他 (資料來源)</div>
            <div class="btn-group" style="margin-bottom: 8px;">

    <script id="v15-core">
        (function(global) {
            function createPoint(id, text, colors) {
                const value = String(text || '');
                const colorMap = Array.isArray(colors) ? colors.slice(0, value.length) : [];
                while (colorMap.length < value.length) colorMap.push(null);
                return { id: String(id), text: value, colors: colorMap };
            }

            function normalizePointText(text) {
                return String(text || '').replace(/｜/g, '：');
            }

            function syncColorMap(oldText, newText, colors) {
                const previous = String(oldText || '');
                const next = String(newText || '');
                const nextColors = Array.isArray(colors) ? colors.slice(0, previous.length) : [];
                while (nextColors.length < previous.length) nextColors.push(null);

                let prefixLength = 0;
                while (
                    prefixLength < previous.length &&
                    prefixLength < next.length &&
                    previous[prefixLength] === next[prefixLength]
                ) {
                    prefixLength++;
                }

                let suffixLength = 0;
                while (
                    suffixLength < previous.length - prefixLength &&
                    suffixLength < next.length - prefixLength &&
                    previous[previous.length - 1 - suffixLength] === next[next.length - 1 - suffixLength]
                ) {
                    suffixLength++;
                }

                const removedLength = previous.length - prefixLength - suffixLength;
                const insertedLength = next.length - prefixLength - suffixLength;
                nextColors.splice(prefixLength, removedLength, ...Array(insertedLength).fill(null));
                nextColors.length = next.length;
                return nextColors;
            }

            function movePoint(points, id, direction) {
                const result = points.map(point => createPoint(point.id, point.text, point.colors));
                const index = result.findIndex(point => point.id === id);
                const target = index + Number(direction);
                if (index < 0 || target < 0 || target >= result.length) return result;
                const [point] = result.splice(index, 1);
                result.splice(target, 0, point);
                return result;
            }

            function removePoint(points, id) {
                return points
                    .filter(point => point.id !== id)
                    .map(point => createPoint(point.id, point.text, point.colors));
            }

            function getLayoutRegions(ratio) {
                const safeRatio = [35, 45, 55].includes(Number(ratio)) ? Number(ratio) : 45;
                const photoHeight = Math.round(1350 * safeRatio / 100);
                return {
                    photo: { x: 0, y: 0, w: 1080, h: photoHeight },
                    text: { x: 0, y: photoHeight, w: 1080, h: 1350 - photoHeight }
                };
            }

            function getSafeBaseName(title, now) {
                const date = now instanceof Date ? now : new Date();
                const stamp = date.getFullYear() +
                    (date.getMonth() + 1).toString().padStart(2, '0') +
                    date.getDate().toString().padStart(2, '0') + '_' +
                    date.getHours().toString().padStart(2, '0') +
                    date.getMinutes().toString().padStart(2, '0');
                const safeTitle = String(title || '').trim().replace(/[\\/:*?"<>|]/g, '') || 'ettoday_chart';
                return `${stamp}_${safeTitle}`;
            }

            global.V15Core = Object.freeze({
                createPoint,
                normalizePointText,
                syncColorMap,
                movePoint,
                removePoint,
                getLayoutRegions,
                getSafeBaseName
            });
        })(globalThis);
    </script>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const C_WHITE = "#FFFFFF";
        const C_BLACK = "#000000";
        const FONT_FAMILY = "'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif";
        const V15_HEADER_TOP = 80;
        const companyLogoImg = new Image();
        companyLogoImg.src = 'assets/ettoday-logo-v15.png';
        companyLogoImg.addEventListener('load', () => draw());
        
        let bgImg = null;
        let currentTagColor = "#F58220";
        const colorableTextIds = ['mainTitle', 'm_Sub'];
        let textColorMaps = { mainTitle: [], m_Sub: [] };
        let trackedTextValues = {
            mainTitle: document.getElementById('mainTitle').value,
            m_Sub: document.getElementById('m_Sub').value
        };
        let activeTextSelection = null;
        let v15PointSequence = 4;
        let v15State = createDefaultV15State();
        let v15RenderResult = { valid: false, reasons: ['請先載入照片。'], contentBottom: 0, safeBottom: 0 };
        let activeLayout = 'magazine';
        let legacyPhotoState = { zoom: 1, panX: 0.5, panY: 0.5, filter: 'none' };
        let photoDragState = null;

        function createDefaultV15State() {
            return {
                ratio: 45,
                theme: 'light',
                pointSize: 40,
                showLogo: true,
                logoMode: 'company',
                photo: { zoom: 1, panX: 0.5, panY: 0.5, filter: 'none' },
                points: [
                    V15Core.createPoint('point-1', '審查時程：本週進入逐案表決'),
                    V15Core.createPoint('point-2', '攻防焦點：預算刪減與凍結比例'),
                    V15Core.createPoint('point-3', '後續影響：民生與建設項目受關注')
                ]
            };
        }

        function normalizeV15State(raw) {
            const defaults = createDefaultV15State();
            if (!raw || typeof raw !== 'object') return defaults;
            const ratio = [35, 45, 55].includes(Number(raw.ratio)) ? Number(raw.ratio) : 45;
            const theme = ['light', 'dark'].includes(raw.theme) ? raw.theme : 'light';
            const pointSize = Math.min(54, Math.max(28, Number(raw.pointSize) || 40));
            const photo = raw.photo && typeof raw.photo === 'object' ? raw.photo : {};
            const usedIds = new Set();
            const points = Array.isArray(raw.points) ? raw.points.map((point, index) => {
                let id = point && typeof point.id === 'string' ? point.id : `point-${index + 1}`;
                if (usedIds.has(id)) id = `point-restored-${index + 1}`;
                usedIds.add(id);
                const restored = V15Core.createPoint(id, point && point.text, point && point.colors);
                const normalizedText = V15Core.normalizePointText(restored.text);
                const normalizedColors = V15Core.syncColorMap(restored.text, normalizedText, restored.colors);
                return V15Core.createPoint(id, normalizedText, normalizedColors);
            }).filter(point => point.text || point.colors.length) : defaults.points;

            return {
                ratio,
                theme,
                pointSize,
                showLogo: raw.showLogo !== false,
                logoMode: ['company', 'capsule'].includes(raw.logoMode) ? raw.logoMode : 'company',
                photo: {
                    zoom: Math.min(3, Math.max(1, Number(photo.zoom) || 1)),
                    panX: Math.min(1, Math.max(0, Number.isFinite(Number(photo.panX)) ? Number(photo.panX) : 0.5)),
                    panY: Math.min(1, Math.max(0, Number.isFinite(Number(photo.panY)) ? Number(photo.panY) : 0.5)),
                    filter: ['none', 'grayscale', 'brightness', 'darken', 'contrast'].includes(photo.filter) ? photo.filter : 'none'
                },
                points: points.length ? points : defaults.points
            };
        }

        function syncV15Controls() {
            document.querySelectorAll('#v15Ratio [data-ratio]').forEach(button => {
                button.classList.toggle('active', Number(button.dataset.ratio) === v15State.ratio);
            });
            document.querySelectorAll('#v15Theme [data-theme]').forEach(button => {
                button.classList.toggle('active', button.dataset.theme === v15State.theme);
            });
            document.getElementById('v15PointSize').value = v15State.pointSize;
            document.getElementById('v_v15PointSize').innerText = v15State.pointSize;
            document.getElementById('v15ShowLogo').checked = v15State.showLogo;
            document.querySelectorAll('#v15LogoMode [data-logo-mode]').forEach(button => {
                button.classList.toggle('active', button.dataset.logoMode === v15State.logoMode);
                button.disabled = !v15State.showLogo;
            });
        }

        function readPhotoControls() {
            return {
                zoom: document.getElementById('bgZoom').value / 100,
                panX: document.getElementById('bgPanX').value / 100,
                panY: document.getElementById('bgPanY').value / 100,
                filter: document.getElementById('bgFilter').value
            };
        }

        function applyPhotoControls(photo) {
            document.getElementById('bgZoom').value = Math.round(photo.zoom * 100);
            document.getElementById('bgPanX').value = Math.round(photo.panX * 100);
            document.getElementById('bgPanY').value = Math.round(photo.panY * 100);
            document.getElementById('bgFilter').value = photo.filter;
            updateVal('bgZoom');
            updateVal('pan');
        }

        function handleImageControlChange(kind) {
            if (kind === 'zoom') updateVal('bgZoom');
            if (kind === 'pan') updateVal('pan');
            const current = readPhotoControls();
            if (document.getElementById('layoutSelector').value === 'news-points') {
                v15State.photo = current;
            } else {
                legacyPhotoState = current;
            }
            draw();
            saveConfig();
        }

        function rememberV15PointSelection(pointId, field) {
            activeTextSelection = {
                pointId,
                start: field.selectionStart || 0,
                end: field.selectionEnd || 0
            };
        }

        function renderPointEditors() {
            const container = document.getElementById('v15PointsEditor');
            if (!container) return;
            container.replaceChildren();
            v15State.points.forEach((point, index) => {
                const row = document.createElement('div');
                row.className = 'v15-point-row';

                const input = document.createElement('input');
                input.type = 'text';
                input.id = `v15-point-${point.id}`;
                input.value = point.text;
                input.placeholder = '請輸入完整重點文字';
                input.setAttribute('aria-label', `第 ${index + 1} 點文字`);
                ['focus', 'select', 'keyup', 'mouseup'].forEach(eventName => {
                    input.addEventListener(eventName, () => rememberV15PointSelection(point.id, input));
                });
                input.addEventListener('input', () => {
                    point.colors = V15Core.syncColorMap(point.text, input.value, point.colors);
                    point.text = input.value;
                    rememberV15PointSelection(point.id, input);
                    draw();
                    saveConfig();
                });

                const up = document.createElement('button');
                up.type = 'button';
                up.className = 'icon-btn';
                up.textContent = '↑';
                up.disabled = index === 0;
                up.setAttribute('aria-label', `上移第 ${index + 1} 點`);
                up.addEventListener('click', () => moveV15Point(point.id, -1));

                const down = document.createElement('button');
                down.type = 'button';
                down.className = 'icon-btn';
                down.textContent = '↓';
                down.disabled = index === v15State.points.length - 1;
                down.setAttribute('aria-label', `下移第 ${index + 1} 點`);
                down.addEventListener('click', () => moveV15Point(point.id, 1));

                const remove = document.createElement('button');
                remove.type = 'button';
                remove.className = 'icon-btn';
                remove.textContent = '×';
                remove.setAttribute('aria-label', `刪除第 ${index + 1} 點`);
                remove.addEventListener('click', () => removeV15Point(point.id));

                row.append(input, up, down, remove);
                container.append(row);
            });
        }

        function addV15Point() {
            const id = `point-${Date.now()}-${v15PointSequence++}`;
            v15State.points.push(V15Core.createPoint(id, `新增重點 ${v15State.points.length + 1}：請輸入完整內容`));
            renderPointEditors();
            draw();
            saveConfig();
        }

        function removeV15Point(id) {
            v15State.points = V15Core.removePoint(v15State.points, id);
            activeTextSelection = null;
            renderPointEditors();
            draw();
            saveConfig();
        }

        function moveV15Point(id, direction) {
            v15State.points = V15Core.movePoint(v15State.points, id, direction);
            activeTextSelection = null;
            renderPointEditors();
            draw();
            saveConfig();
        }

        function setV15Ratio(ratio) {
            v15State.ratio = [35, 45, 55].includes(Number(ratio)) ? Number(ratio) : 45;
            syncV15Controls();
            draw();
            saveConfig();
        }

        function setV15Theme(theme) {
            v15State.theme = theme === 'dark' ? 'dark' : 'light';
            syncV15Controls();
            draw();
            saveConfig();
        }

        function setV15PointSize(size) {
            v15State.pointSize = Math.min(54, Math.max(28, Number(size) || 40));
            syncV15Controls();
            draw();
            saveConfig();
        }

        function setV15ShowLogo(show) {
            v15State.showLogo = Boolean(show);
            syncV15Controls();
            draw();
            saveConfig();
        }

        function setV15LogoMode(mode) {
            v15State.logoMode = mode === 'capsule' ? 'capsule' : 'company';
            syncV15Controls();
            draw();
            saveConfig();
        }

        document.fonts.ready.then(function() { draw(); });

        window.onload = function() {
            loadConfig(); 
            legacyPhotoState = readPhotoControls();
            switchLayout(false); 
            updateAllVals();
            syncV15Controls();
            renderPointEditors();
            draw(); 
        };

        function loadImgFromUrl() {
            let url = document.getElementById('imgUrl').value.trim();
            if(!url) return;

            const proxies = [
                (u) => `https://images.weserv.nl/?url=${encodeURIComponent(u)}&output=png&t=${Date.now()}`,
                (u) => `https://wsrv.nl/?url=${encodeURIComponent(u)}&output=png&t=${Date.now()}`,
                (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`
            ];

            let proxyIndex = 0;
            const btn = document.querySelector('.url-btn');
            const originalBtnText = btn.innerText;
            
            btn.innerText = "⏳ 嘗試中...";
            btn.disabled = true;

            function tryLoad() {
                if (proxyIndex >= proxies.length) {
                    alert('❌ 所有代理通道都失效！\n\n原因可能是：\n1. 圖片來源網站擋住了代理伺服器。\n2. 連結本身無效。\n\n💡 建議：請直接「下載圖片」到電腦，再使用「上傳背景」功能。');
                    btn.innerText = originalBtnText;
                    btn.disabled = false;
                    return;
                }

                const img = new Image();
                img.crossOrigin = "Anonymous"; 

                const currentProxyUrl = proxies[proxyIndex](url);
                console.log(`正在嘗試通道 ${proxyIndex + 1}:`, currentProxyUrl);

                img.onload = function() {
                    bgImg = img;
                    if (document.getElementById('layoutSelector').value === 'news-points') {
                        resetV15PhotoPosition(false);
                    }
                    draw();
                    document.getElementById('imgUrl').value = ''; 
                    
                    btn.innerText = "✅ 成功";
                    setTimeout(() => { 
                        btn.innerText = originalBtnText; 
                        btn.disabled = false;
                    }, 1000);
                };

                img.onerror = function() {
                    console.warn(`通道 ${proxyIndex + 1} 失敗，切換下一個...`);
                    proxyIndex++;
                    tryLoad(); 
                };

                img.src = currentProxyUrl;
            }

            tryLoad(); 
        }

        function updateVal(id) {
            if (id === 'pan') {
                const x = document.getElementById('bgPanX').value;
                const y = document.getElementById('bgPanY').value;
                document.getElementById('v_pan').innerText = `${x}, ${y}`;
            } else {
                const val = document.getElementById(id).value;
                if(document.getElementById('v_' + id)) {
                    document.getElementById('v_' + id).innerText = val;
                }
            }
        }
        
        function updateAllVals() {
            ['bgZoom', 'titleSize', 'm_SubSize', 'm_Overlay', 'g_SubSize'].forEach(id => updateVal(id));
            updateVal('pan');
        }

        function saveConfig() {
            const config = {
                layout: document.getElementById('layoutSelector').value,
                mainTitle: document.getElementById('mainTitle').value,
                tagText: document.getElementById('tagText').value,
                sourceText: document.getElementById('sourceText').value,
                m_Sub: document.getElementById('m_Sub').value,
                g_Title: document.getElementById('g_Title').value,
                g_Desc: document.getElementById('g_Desc').value,
                tagColor: currentTagColor,
                titleSize: document.getElementById('titleSize').value,
                bgZoom: document.getElementById('bgZoom').value,
                bgPanX: document.getElementById('bgPanX').value,
                bgPanY: document.getElementById('bgPanY').value,
                bgFilter: document.getElementById('bgFilter').value,
                showDate: document.getElementById('showDate').checked,
                textColorMaps: textColorMaps,
                v15State: v15State
            };
            localStorage.setItem('et_chart_v15_config', JSON.stringify(config));
        }

        function loadConfig() {
            const saved = localStorage.getItem('et_chart_v15_config');
            if (saved) {
                try {
                    const config = JSON.parse(saved);
                    document.getElementById('layoutSelector').value = config.layout || 'magazine';
                    document.getElementById('mainTitle').value = config.mainTitle || '';
                    document.getElementById('tagText').value = config.tagText || '';
                    document.getElementById('sourceText').value = config.sourceText || '';
                    document.getElementById('m_Sub').value = config.m_Sub || '';
                    document.getElementById('g_Title').value = config.g_Title || '';
                    document.getElementById('g_Desc').value = config.g_Desc || '';
                    document.getElementById('titleSize').value = config.titleSize || 90;
                    document.getElementById('bgZoom').value = config.bgZoom || 100;
                    document.getElementById('bgPanX').value = config.bgPanX || 50;
                    document.getElementById('bgPanY').value = config.bgPanY || 50;
                    document.getElementById('bgFilter').value = config.bgFilter || 'none';
                    if (typeof config.showDate === 'boolean') document.getElementById('showDate').checked = config.showDate;
                    if(config.tagColor) currentTagColor = config.tagColor;
                    v15State = normalizeV15State(config.v15State);
                    if (config.textColorMaps) {
                        colorableTextIds.forEach(id => {
                            if (Array.isArray(config.textColorMaps[id])) {
                                textColorMaps[id] = config.textColorMaps[id].slice(0, document.getElementById(id).value.length);
                            }
                        });
                    }
                } catch (error) {
                    console.warn('無法讀取已儲存的設定，改用預設值。', error);
                    localStorage.removeItem('et_chart_v15_config');
                }
            }
            colorableTextIds.forEach(id => {
                const textLength = document.getElementById(id).value.length;
                textColorMaps[id] = Array.from({ length: textLength }, (_, index) => textColorMaps[id][index] || null);
                trackedTextValues[id] = document.getElementById(id).value;
            });
        }

        function resetConfig() {
            if(confirm('確定要重設所有文字、照片位置與設定嗎？')) {
                localStorage.removeItem('et_chart_v15_config');
                location.reload();
            }
        }

        function rememberTextSelection(id) {
            const field = document.getElementById(id);
            activeTextSelection = {
                id: id,
                start: field.selectionStart || 0,
                end: field.selectionEnd || 0
            };
        }

        function syncTextColorMap(id) {
            const field = document.getElementById(id);
            const oldText = trackedTextValues[id] || '';
            const newText = field.value;
            if (oldText === newText) return;

            let prefixLength = 0;
            while (prefixLength < oldText.length && prefixLength < newText.length && oldText[prefixLength] === newText[prefixLength]) {
                prefixLength++;
            }

            let suffixLength = 0;
            while (
                suffixLength < oldText.length - prefixLength &&
                suffixLength < newText.length - prefixLength &&
                oldText[oldText.length - 1 - suffixLength] === newText[newText.length - 1 - suffixLength]
            ) {
                suffixLength++;
            }

            const removedLength = oldText.length - prefixLength - suffixLength;
            const insertedLength = newText.length - prefixLength - suffixLength;
            const insertedColors = Array(insertedLength).fill(null);
            textColorMaps[id].splice(prefixLength, removedLength, ...insertedColors);
            textColorMaps[id].length = newText.length;
            trackedTextValues[id] = newText;
        }

        function applySelectedTextColor(color) {
            if (!activeTextSelection || activeTextSelection.start === activeTextSelection.end) {
                alert('請先反白選取主標題或內文中的文字。');
                return;
            }

            const { id, pointId, start, end } = activeTextSelection;
            if (pointId) {
                const point = v15State.points.find(item => item.id === pointId);
                if (!point) return;
                for (let index = start; index < end; index++) point.colors[index] = color;
                draw();
                saveConfig();
                const pointField = document.getElementById(`v15-point-${pointId}`);
                if (pointField) {
                    pointField.focus();
                    pointField.setSelectionRange(start, end);
                }
                return;
            }

            for (let index = start; index < end; index++) {
                textColorMaps[id][index] = color;
            }
            draw();
            saveConfig();

            const field = document.getElementById(id);
            field.focus();
            field.setSelectionRange(start, end);
        }

        colorableTextIds.forEach(id => {
            const field = document.getElementById(id);
            ['focus', 'select', 'keyup', 'mouseup'].forEach(eventName => {
                field.addEventListener(eventName, () => rememberTextSelection(id));
            });
        });

        document.querySelectorAll('input, textarea, select').forEach(el => {
            el.addEventListener('input', () => {
                if (colorableTextIds.includes(el.id)) syncTextColorMap(el.id);
                draw();
                saveConfig();
            });
        });

        function setTagText(text) {
            document.getElementById('tagText').value = text;
            draw();
            saveConfig();
        }
        
        function setTagColor(color) {
            currentTagColor = color;
            draw();
            saveConfig();
        }

        function setSourceText(text) {
            document.getElementById('sourceText').value = text;
            draw();
            saveConfig();
        }

        const dropZone = document.getElementById('dropZone');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });
        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }
        dropZone.addEventListener('drop', handleDrop, false);
        function handleDrop(e) {
            let dt = e.dataTransfer;
            let files = dt.files;
            handleBg({ files: files });
        }

        function handleBg(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function (e) {
                    var img = new Image();
                    img.onload = function() {
                        bgImg = img;
                        if (document.getElementById('layoutSelector').value === 'news-points') {
                            resetV15PhotoPosition(false);
                        }
                        draw();
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function getCanvasPoint(event) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (event.clientX - rect.left) * canvas.width / rect.width,
                y: (event.clientY - rect.top) * canvas.height / rect.height
            };
        }

        function startPhotoDrag(event) {
            if (document.getElementById('layoutSelector').value !== 'news-points' || !bgImg) return;
            const point = getCanvasPoint(event);
            const photo = V15Core.getLayoutRegions(v15State.ratio).photo;
            if (point.x < photo.x || point.x > photo.x + photo.w || point.y < photo.y || point.y > photo.y + photo.h) return;
            photoDragState = { pointerId: event.pointerId, x: point.x, y: point.y };
            canvas.setPointerCapture(event.pointerId);
            canvas.style.cursor = 'grabbing';
        }

        function movePhotoDrag(event) {
            if (!photoDragState || event.pointerId !== photoDragState.pointerId) return;
            const point = getCanvasPoint(event);
            const photo = V15Core.getLayoutRegions(v15State.ratio).photo;
            const deltaX = point.x - photoDragState.x;
            const deltaY = point.y - photoDragState.y;
            v15State.photo.panX = Math.min(1, Math.max(0, v15State.photo.panX - deltaX / photo.w));
            v15State.photo.panY = Math.min(1, Math.max(0, v15State.photo.panY - deltaY / photo.h));
            photoDragState.x = point.x;
            photoDragState.y = point.y;
            applyPhotoControls(v15State.photo);
            draw();
            saveConfig();
        }

        function endPhotoDrag(event) {
            if (!photoDragState || event.pointerId !== photoDragState.pointerId) return;
            photoDragState = null;
            canvas.style.cursor = 'grab';
        }

        function resetV15PhotoPosition(shouldSave = true) {
            v15State.photo.zoom = 1;
            v15State.photo.panX = 0.5;
            v15State.photo.panY = 0.5;
            if (document.getElementById('layoutSelector').value === 'news-points') applyPhotoControls(v15State.photo);
            draw();
            if (shouldSave) saveConfig();
        }

        canvas.addEventListener('pointerdown', startPhotoDrag);
        canvas.addEventListener('pointermove', movePhotoDrag);
        canvas.addEventListener('pointerup', endPhotoDrag);
        canvas.addEventListener('pointercancel', endPhotoDrag);

        function switchLayout(resetValues = true) {
            const layout = document.getElementById('layoutSelector').value;
            if (activeLayout === 'news-points') {
                v15State.photo = readPhotoControls();
            } else {
                legacyPhotoState = readPhotoControls();
            }
            if (layout === 'news-points') {
                applyPhotoControls(v15State.photo);
            } else if (activeLayout === 'news-points') {
                applyPhotoControls(legacyPhotoState);
            }
            activeLayout = layout;
            document.querySelectorAll('.input-group').forEach(el => el.classList.remove('active'));
            if(document.getElementById('group-' + layout)) {
                document.getElementById('group-' + layout).classList.add('active');
            }
            if (resetValues) {
                if(layout === 'magazine') {
                    document.getElementById('titleSize').value = 90;
                } else if (layout === 'glass') {
                    document.getElementById('titleSize').value = 64;
                } else {
                    document.getElementById('titleSize').value = 72;
                }
                updateAllVals();
            }
            canvas.style.cursor = layout === 'news-points' ? 'grab' : 'default';
            saveConfig();
            draw();
        }

        function draw() {
            ctx.fillStyle = "#222";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const layout = document.getElementById('layoutSelector').value;

            if (layout === 'news-points') {
                v15RenderResult = drawNewsPoints();
                updateV15Validation(v15RenderResult);
                return;
            }

            document.getElementById('downloadButton').disabled = false;
            document.getElementById('copyButton').disabled = false;

            drawFullBg();

            if (layout === 'magazine') drawMagazine();
            else if (layout === 'glass') drawGlass();

            drawSource();
            drawDate();
            drawV15LogoLayer();
        }

        function updateV15Validation(result) {
            const element = document.getElementById('v15Validation');
            if (!element) return;
            element.classList.toggle('invalid', !result.valid);
            element.innerText = result.valid ? '目前內容可以輸出。' : result.reasons.join(' ');
            document.getElementById('downloadButton').disabled = !result.valid;
            document.getElementById('copyButton').disabled = !result.valid;
        }

        function drawFullBg() {
            const filter = document.getElementById('bgFilter').value;
            ctx.filter = 'none';
            if (filter === 'grayscale') ctx.filter = 'grayscale(100%)';
            if (filter === 'brightness') ctx.filter = 'brightness(120%)';
            if (filter === 'darken') ctx.filter = 'brightness(70%)';
            if (filter === 'contrast') ctx.filter = 'contrast(130%)';

            if (bgImg) {
                const zoom = document.getElementById('bgZoom').value / 100;
                const panX = document.getElementById('bgPanX').value / 100;
                const panY = document.getElementById('bgPanY').value / 100;
                drawImageProp(ctx, bgImg, 0, 0, canvas.width, canvas.height, panX, panY, zoom);
            } else {
                let grd = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                grd.addColorStop(0, "#333");
                grd.addColorStop(1, "#111");
                ctx.fillStyle = grd;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.filter = 'none';
                ctx.fillStyle = "#555";
                ctx.font = "bold 60px Arial";
                ctx.textAlign = "center";
                ctx.fillText("請上傳背景圖片", canvas.width/2, canvas.height/2);
            }
            ctx.filter = 'none';
        }

        function applyCanvasImageFilter(filter) {
            ctx.filter = 'none';
            if (filter === 'grayscale') ctx.filter = 'grayscale(100%)';
            if (filter === 'brightness') ctx.filter = 'brightness(120%)';
            if (filter === 'darken') ctx.filter = 'brightness(70%)';
            if (filter === 'contrast') ctx.filter = 'contrast(130%)';
        }

        function getWrappedLines(context, text, maxWidth) {
            const lines = [];
            let line = [];
            let lineWidth = 0;
            const value = String(text || '');

            for (let index = 0; index < value.length; index++) {
                const character = value[index];
                if (character === '\n') {
                    lines.push(line);
                    line = [];
                    lineWidth = 0;
                    continue;
                }
                const width = context.measureText(character).width;
                if (line.length && lineWidth + width > maxWidth) {
                    lines.push(line);
                    line = [];
                    lineWidth = 0;
                }
                line.push({ character, index, width });
                lineWidth += width;
            }
            lines.push(line);
            return lines;
        }

        function measureWrappedText(context, text, maxWidth, lineHeight) {
            const lines = getWrappedLines(context, text, maxWidth);
            return { lines, height: Math.max(1, lines.length) * lineHeight };
        }

        function drawColoredWrappedText(context, text, colorMap, x, y, maxWidth, lineHeight) {
            const defaultColor = context.fillStyle;
            const lines = getWrappedLines(context, text, maxWidth);
            lines.forEach((characters, lineIndex) => {
                let cursorX = x;
                let segment = '';
                let segmentColor = null;

                function flush() {
                    if (!segment) return;
                    context.fillStyle = segmentColor || defaultColor;
                    context.fillText(segment, cursorX, y + lineIndex * lineHeight);
                    cursorX += context.measureText(segment).width;
                    segment = '';
                }

                characters.forEach(item => {
                    const characterColor = colorMap && colorMap[item.index] ? colorMap[item.index] : null;
                    if (segment && characterColor !== segmentColor) flush();
                    segmentColor = characterColor;
                    segment += item.character;
                });
                flush();
            });
            context.fillStyle = defaultColor;
            return y + Math.max(1, lines.length) * lineHeight;
        }

        function drawV15LogoLayer() {
            if (!v15State.showLogo) return;

            const logoWidth = 180;
            const logoHeight = 64;
            const logoX = canvas.width - logoWidth - 50;
            const logoY = V15_HEADER_TOP;

            if (v15State.logoMode === 'capsule') {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                roundRect(ctx, logoX, logoY, logoWidth, logoHeight, 32);
                ctx.fill();
                ctx.fillStyle = C_WHITE;
                ctx.font = "bold 34px Arial, 'Microsoft JhengHei', sans-serif";
                ctx.textAlign = 'center';
                ctx.fillText('ETtoday', logoX + logoWidth / 2, logoY + 43);
                return;
            }

            ctx.save();
            ctx.fillStyle = 'rgba(255,255,255,0.92)';
            roundRect(ctx, logoX, logoY, logoWidth, logoHeight, 10);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,0.14)';
            ctx.lineWidth = 2;
            ctx.stroke();

            if (companyLogoImg.complete && companyLogoImg.naturalWidth) {
                const imageWidth = 152;
                const imageHeight = imageWidth * companyLogoImg.naturalHeight / companyLogoImg.naturalWidth;
                ctx.drawImage(
                    companyLogoImg,
                    logoX + (logoWidth - imageWidth) / 2,
                    logoY + (logoHeight - imageHeight) / 2,
                    imageWidth,
                    imageHeight
                );
            } else {
                ctx.fillStyle = '#1A1A1D';
                ctx.font = "bold 30px Arial, 'Microsoft JhengHei', sans-serif";
                ctx.textAlign = 'center';
                ctx.fillText('ETtoday', logoX + logoWidth / 2, logoY + 42);
            }
            ctx.restore();
        }

        function drawV15TitleBand(regions, dark, textColor, title, titleSize, left, textWidth) {
            const titleBandTop = regions.text.y;
            const compactText = v15State.ratio === 55;
            const defaultTitleBandPaddingTop = 54;
            const titleBandPaddingTop = compactText ? 20 : defaultTitleBandPaddingTop;
            const titleBandPaddingBottom = compactText ? 12 : 28;
            const titleToPointsGap = compactText ? 55 : 64;
            const titleLineHeight = titleSize * 1.18;

            ctx.font = `900 ${titleSize}px ${FONT_FAMILY}`;
            const titleMeasure = measureWrappedText(ctx, title, textWidth, titleLineHeight);
            const titleBandHeight = titleBandPaddingTop + titleMeasure.lines.length * titleLineHeight + titleBandPaddingBottom;

            ctx.fillStyle = currentTagColor;
            ctx.fillRect(0, titleBandTop, canvas.width, 12);

            ctx.textAlign = 'left';
            ctx.fillStyle = textColor;
            ctx.font = `900 ${titleSize}px ${FONT_FAMILY}`;
            const titleBaseline = titleBandTop + titleBandPaddingTop + titleSize;
            drawColoredWrappedText(ctx, title, textColorMaps.mainTitle, left, titleBaseline, textWidth, titleLineHeight);

            return {
                cursorY: titleBandTop + titleBandHeight + titleToPointsGap,
                titleMeasure
            };
        }

        function drawNewsPoints() {
            const regions = V15Core.getLayoutRegions(v15State.ratio);
            const filter = v15State.photo.filter;
            const zoom = v15State.photo.zoom;
            const panX = v15State.photo.panX;
            const panY = v15State.photo.panY;
            const reasons = [];

            ctx.save();
            ctx.beginPath();
            ctx.rect(regions.photo.x, regions.photo.y, regions.photo.w, regions.photo.h);
            ctx.clip();
            applyCanvasImageFilter(filter);
            if (bgImg) {
                drawImageProp(ctx, bgImg, regions.photo.x, regions.photo.y, regions.photo.w, regions.photo.h, panX, panY, zoom);
            } else {
                ctx.filter = 'none';
                ctx.fillStyle = '#26313a';
                ctx.fillRect(regions.photo.x, regions.photo.y, regions.photo.w, regions.photo.h);
                ctx.fillStyle = '#aeb9c1';
                ctx.font = `bold 48px ${FONT_FAMILY}`;
                ctx.textAlign = 'center';
                ctx.fillText('請上傳新聞照片', canvas.width / 2, regions.photo.h / 2);
                reasons.push('尚未載入照片。');
            }
            ctx.restore();
            ctx.filter = 'none';

            drawTag(50, V15_HEADER_TOP, document.getElementById('tagText').value);

            const dark = v15State.theme === 'dark';
            const textColor = dark ? '#F5F5F5' : '#202124';
            ctx.fillStyle = dark ? '#17191D' : '#F4F0E8';
            ctx.fillRect(regions.text.x, regions.text.y, regions.text.w, regions.text.h);

            const left = 70;
            const textWidth = 940;
            const titleSize = parseInt(document.getElementById('titleSize').value);
            const title = document.getElementById('mainTitle').value;
            const titleBand = drawV15TitleBand(regions, dark, textColor, title, titleSize, left, textWidth);
            let cursorY = titleBand.cursorY;
            if (titleBand.titleMeasure.lines.length > 3) reasons.push('主標題行數過多。');

            const pointSize = v15State.pointSize;
            const pointGap = v15State.ratio === 55 ? 6 : 20;
            v15State.points.forEach((point, index) => {
                const pointTextSize = pointSize + 2;
                const pointLineHeight = pointTextSize * 1.35;
                const markerCenterY = cursorY - pointTextSize * 0.32;

                ctx.fillStyle = currentTagColor;
                ctx.beginPath();
                ctx.arc(96, markerCenterY, 26, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = C_WHITE;
                ctx.font = `900 27px ${FONT_FAMILY}`;
                ctx.textAlign = 'center';
                ctx.fillText(String(index + 1), 96, markerCenterY + 10);

                ctx.textAlign = 'left';
                ctx.fillStyle = textColor;
                ctx.font = `900 ${pointTextSize}px ${FONT_FAMILY}`;
                cursorY = drawColoredWrappedText(ctx, point.text, point.colors, 150, cursorY, 860, pointLineHeight);
                cursorY += pointGap;
            });

            const contentBottom = cursorY;
            const safeBottom = 1260;
            if (contentBottom > safeBottom) reasons.push('文字超出安全範圍，請精簡內容或調整比例。');

            ctx.textAlign = 'left';
            ctx.fillStyle = dark ? 'rgba(255,255,255,0.68)' : 'rgba(0,0,0,0.58)';
            ctx.font = `bold 26px ${FONT_FAMILY}`;
            const source = document.getElementById('sourceText').value;
            if (source) ctx.fillText(source, 50, 1310);

            if (document.getElementById('showDate').checked) {
                const today = new Date();
                const date = today.getFullYear() + '.' +
                    (today.getMonth() + 1).toString().padStart(2, '0') + '.' +
                    today.getDate().toString().padStart(2, '0');
                ctx.textAlign = 'right';
                ctx.fillText(date, canvas.width - 50, 1310);
            }

            drawV15LogoLayer();
            return { valid: reasons.length === 0, reasons, contentBottom, safeBottom };
        }

        function drawMagazine() {
            const strength = document.getElementById('m_Overlay').value;
            let grd = ctx.createLinearGradient(0, 500, 0, 1350);
            grd.addColorStop(0, "transparent");
            grd.addColorStop(0.3, `rgba(0,0,0,${strength * 0.5})`);
            grd.addColorStop(1, `rgba(0,0,0,${strength})`);
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const titleSize = parseInt(document.getElementById('titleSize').value);
            const contentSize = parseInt(document.getElementById('m_SubSize').value);

            // 1. Tag (y=850)
            const tag = document.getElementById('tagText').value;
            drawTag(80, 850, tag);

            // 2. Title
            const titleY = 1020; 
            const title = document.getElementById('mainTitle').value;
            ctx.fillStyle = C_WHITE;
            ctx.font = `900 ${titleSize}px ${FONT_FAMILY}`;
            ctx.textAlign = "left";
            ctx.shadowColor = "rgba(0,0,0,0.8)";
            ctx.shadowBlur = 20;
            wrapText(ctx, title, 80, titleY, 920, titleSize * 1.25, textColorMaps.mainTitle);
            ctx.shadowBlur = 0;

            // 3. Sub
            const sub = document.getElementById('m_Sub').value;
            ctx.fillStyle = "#ddd";
            ctx.font = `bold ${contentSize}px ${FONT_FAMILY}`;
            wrapText(ctx, sub, 80, 1220, 920, contentSize * 1.4, textColorMaps.m_Sub);
        }

        function drawGlass() {
            ctx.fillStyle = "rgba(0,0,0,0.2)";
            ctx.fillRect(0,0, canvas.width, canvas.height);

            const titleSize = parseInt(document.getElementById('titleSize').value);
            const contentSize = parseInt(document.getElementById('g_SubSize').value);

            const x = 80, y = 750, w = 920, h = 500;
            
            ctx.save();
            roundRect(ctx, x, y, w, h, 40);
            ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
            ctx.fill();
            ctx.shadowColor = "rgba(0,0,0,0.3)";
            ctx.shadowBlur = 40;
            ctx.shadowOffsetY = 20;
            ctx.restore();

            // Tag 浮在卡片左上
            const tag = document.getElementById('tagText').value;
            drawTag(x + 60, y - 40, tag);

            const title = document.getElementById('mainTitle').value;
            ctx.fillStyle = C_BLACK;
            ctx.font = `900 ${titleSize}px ${FONT_FAMILY}`;
            ctx.textAlign = "left";
            wrapText(ctx, title, x + 60, y + 90, w - 120, titleSize * 1.3); 
            
            const gTitle = document.getElementById('g_Title').value;
            ctx.fillStyle = "#F58220";
            const subHeaderSize = contentSize + 6; 
            ctx.font = `bold ${subHeaderSize}px ${FONT_FAMILY}`;
            ctx.fillText(gTitle, x + 60, y + 240); 

            const desc = document.getElementById('g_Desc').value;
            ctx.fillStyle = "#444";
            ctx.font = `bold ${contentSize}px ${FONT_FAMILY}`;
            wrapText(ctx, desc, x + 60, y + 310, w - 120, contentSize * 1.5);
        }

        function drawTag(x, y, text) {
            const fontSize = 32;
            ctx.font = `bold ${fontSize}px ${FONT_FAMILY}`;
            const metrics = ctx.measureText(text);
            const paddingX = 40; 
            const paddingY = 24; 
            const w = metrics.width + paddingX;
            const h = fontSize + paddingY;

            ctx.fillStyle = currentTagColor;
            roundRect(ctx, x, y, w, h, 8);
            ctx.fill();
            
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.fillText(text, x + w/2, y + h/2 + fontSize/3);
        }

        function drawSource() {
            const source = document.getElementById('sourceText').value;
            if (!source) return;

            ctx.textAlign = "center";
            ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
            ctx.font = `bold 26px ${FONT_FAMILY}`;
            ctx.shadowColor = "rgba(0,0,0,0.9)";
            ctx.shadowBlur = 4;
            
            ctx.fillText(source, 540, 1310); 
            ctx.shadowBlur = 0;
        }

        function drawDate() {
            if (!document.getElementById('showDate').checked) return;

            const today = new Date();
            const dateStr = today.getFullYear() + '.' + (today.getMonth()+1).toString().padStart(2, '0') + '.' + today.getDate().toString().padStart(2, '0');
            
            ctx.textAlign = "right";
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.font = `bold 26px ${FONT_FAMILY}`;
            ctx.shadowColor = "rgba(0,0,0,0.9)";
            ctx.shadowBlur = 4;
            
            ctx.fillText(dateStr, canvas.width - 50, 1310);
            ctx.shadowBlur = 0;
        }

        function drawImageProp(ctx, img, x, y, w, h, offsetX, offsetY, zoom) {
            if (arguments.length === 2) { x = y = 0; w = ctx.canvas.width; h = ctx.canvas.height; }
            offsetX = typeof offsetX === "number" ? offsetX : 0.5;
            offsetY = typeof offsetY === "number" ? offsetY : 0.5;
            zoom = typeof zoom === "number" ? zoom : 1.0; 

            if (offsetX < 0) offsetX = 0; if (offsetY < 0) offsetY = 0; if (offsetX > 1) offsetX = 1; if (offsetY > 1) offsetY = 1;
            var iw = img.width, ih = img.height, r = Math.min(w / iw, h / ih), nw = iw * r, nh = ih * r, cx, cy, cw, ch, ar = 1;
            if (nw < w) ar = w / nw; if (Math.abs(ar - 1) < 1e-14 && nh < h) ar = h / nh; nw *= ar; nh *= ar;
            cw = iw / (nw / w); ch = ih / (nh / h); 

            cw /= zoom;
            ch /= zoom;

            cx = (iw - cw) * offsetX;
            cy = (ih - ch) * offsetY;

            if (cx < 0) cx = 0; if (cy < 0) cy = 0; if (cx + cw > iw) cx = iw - cw; if (cy + ch > ih) cy = ih - ch;
            ctx.drawImage(img, cx, cy, cw, ch,  x, y, w, h);
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight, colorMap = null) {
            const defaultColor = context.fillStyle;
            const lines = [];
            let line = [];
            let lineWidth = 0;

            for (let index = 0; index < text.length; index++) {
                const character = text[index];
                if (character === '\n') {
                    lines.push(line);
                    line = [];
                    lineWidth = 0;
                    continue;
                }

                const characterWidth = context.measureText(character).width;
                if (line.length > 0 && lineWidth + characterWidth > maxWidth) {
                    lines.push(line);
                    line = [];
                    lineWidth = 0;
                }
                line.push({ character, index, width: characterWidth });
                lineWidth += characterWidth;
            }
            lines.push(line);

            lines.forEach((characters, lineIndex) => {
                let cursorX = x;
                let segment = '';
                let segmentColor = null;

                const flushSegment = () => {
                    if (!segment) return;
                    context.fillStyle = segmentColor || defaultColor;
                    context.fillText(segment, cursorX, y + lineIndex * lineHeight);
                    cursorX += context.measureText(segment).width;
                    segment = '';
                };

                characters.forEach(item => {
                    const characterColor = colorMap && colorMap[item.index] ? colorMap[item.index] : null;
                    if (segment && characterColor !== segmentColor) flushSegment();
                    segmentColor = characterColor;
                    segment += item.character;
                });
                flushSegment();
            });
            context.fillStyle = defaultColor;
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }
        
        function getSafeFilename() {
            const now = new Date();
            const dateStr = now.getFullYear() +
                            (now.getMonth()+1).toString().padStart(2, '0') +
                            now.getDate().toString().padStart(2, '0') + '_' +
                            now.getHours().toString().padStart(2, '0') +
                            now.getMinutes().toString().padStart(2, '0');
            let title = document.getElementById('mainTitle').value.trim();
            title = title.replace(/[\\/:*?"<>|]/g, '');
            if(!title) title = 'ettoday_chart';
            return `${dateStr}_${title}.png`;
        }

        function downloadImage() {
            if (document.getElementById('layoutSelector').value === 'news-points') {
                if (!v15RenderResult.valid) return;
            }
            try {
                var link = document.createElement('a');
                link.download = getSafeFilename();
                link.href = canvas.toDataURL();
                link.click();
            } catch(e) {
                console.error(e);
                alert('❌ 下載失敗！\n原因：瀏覽器判定這張圖片不安全 (CORS)。\n請改用「下載圖片後上傳」的方式，這是最穩定的。');
            }
        }
        
        async function copyImage() {
            if (document.getElementById('layoutSelector').value === 'news-points') {
                if (!v15RenderResult.valid) return;
            }
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve));
                if (!blob) throw new Error('CORS tainted');
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);
                alert('✅ 圖片已複製到剪貼簿！');
            } catch (err) {
                console.error(err);
                alert('❌ 複製失敗！\n1. 請確認這不是被保護的網路圖片 (請改用下載後上傳)\n2. 或者改用「下載圖卡」');
            }
        }
    </script>
